const te=new TextEncoder(),b64=u=>btoa(String.fromCharCode.apply(null,new Uint8Array(u))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),rnd=n=>crypto.getRandomValues(new Uint8Array(n));

const okMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e),COMMON=['password','12345678','123456789','qwertyui','11111111','iloveyou','letmein1','password1','admin123'];
const pwScore=p=>{let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p))s++;return COMMON.includes(p.toLowerCase())?0:s};
const initials=n=>(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const msg=(el,t,ok)=>{if(el){el.textContent=t;el.className='ms '+(ok?'ok':'er')}};

/* ===== AUTH ===== */
const emptyData=()=>({settings:null,saved:[],notes:[],plans:[]}),U={get:()=>LS('pp-users',{}),set:v=>SV('pp-users',v)},dK=id=>'pp-data-'+id;

let RECOV=null,PENDING=null;
{const q=new URLSearchParams(location.hash.slice(1)),tk=q.get('access_token'),ty=q.get('type');if(tk){history.replaceState(null,'',location.pathname+(ty==='recovery'?'#/reset':'#/'));if(ty==='recovery')RECOV=tk;else PENDING={tk,rt:q.get('refresh_token'),ex:+q.get('expires_in')||3600}}}

   const s=A.sGet();if(!s)return;if(cloud)await A.cRestore(s);else{if(s.exp<Date.now())throw 0;const u=Object.values(U.get()).find(x=>x.id===s.id);if(!u)throw 0;A.user=u;A.data=Object.assign(emptyData(),LS(dK(u.id),{}))}}catch(e){A.user=null;A.sSet(null)}},

 async cSession(j,rem){const u=j.user||{},name=(u.user_metadata&&u.user_metadata.name)||(u.email||'').split('@')[0];A.tok=j.access_token;A.user={id:u.id,email:u.email,name,cloud:true};A.sSet({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,id:u.id,email:u.email,name,remember:rem},rem);await A.cLoad()},

 async signupLocal(name,em,pw){const us=U.get();if(us[em])throw new Error('An account with that email already exists. Try logging in.');const salt=rnd(16),rs=rnd(16),code=recCode();us[em]={id:uid(),name,email:em,salt:b64(salt),hash:await kdf(pw,salt),rsalt:b64(rs),rhash:await kdf(code,rs),created:Date.now()};U.set(us);return code},
 async loginLocal(em,pw,rem){const k='pp-fail-'+em,f=LS(k,{n:0,until:0});if(f.until>Date.now())throw new Error('Too many attempts. Try again in '+Math.ceil((f.until-Date.now())/1000)+' seconds.');
   const u=U.get()[em];let ok=false;if(u)ok=same(await kdf(pw,ub64(u.salt)),u.hash);else await kdf(pw,rnd(16));
   if(!ok){f.n++;if(f.n>=5)f.until=Date.now()+30000*Math.pow(2,Math.min(f.n-5,4));SV(k,f);throw new Error('Incorrect email or password.')}
   SV(k,{n:0,until:0});A.user=u;A.data=Object.assign(emptyData(),LS(dK(u.id),{}));A.sSet({id:u.id,exp:Date.now()+(rem?2592e6:432e5)},rem);return u},

/* ===== SETTINGS ===== */
let S=Object.assign({},DEF,{music:MUS.on,vol:MUS.vol},LS('pp-settings',{}));

 if(S.leg&&!document.getElementById('legfont')){const l=document.createElement('link');l.id='legfont';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap';document.head.appendChild(l)}

/* ===== MUSIC STATIONS (original, generated live) ===== */
const mtof=m=>440*Math.pow(2,(m-69)/12),pick=a=>a[Math.random()*a.length|0],PEN=[0,3,5,7,10];
const E={id:'scroll',want:S.station,step:0,next:0,bus:null,filt:null,pat:null,sg:-1};
const au=new Audio();au.preload='none';
function mkBus(){const c=MUS.ctx;if(E.bus)return;E.bus=c.createGain();E.filt=c.createBiquadFilter();E.filt.type='lowpass';E.filt.frequency.value=2400;E.bus.connect(E.filt);E.filt.connect(MUS.master);const s=c.createGain();s.gain.value=.4;E.filt.connect(s);s.connect(MUS.send)}

 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.v||.08,t+(o.att||.01));g.gain.exponentialRampToValueAtTime(.0008,t+d);out.connect(g);g.connect(E.bus);os.start(t);os.stop(t+d+.05)}

const STS={
 drift:{n:'Drift',d:'Ambient pads and glassy bells',bpm:56,spb:2,cut:1500,step(i,t){const ch=[[57,60,64],[53,57,60],[55,59,62],[52,55,59]],b=Math.floor(i/16)%4;if(i%16===0){ch[b].forEach((m,k)=>nt(mtof(m),t,10,{att:3,v:.045,cut:1300,det:k*4}));nt(mtof(ch[b][0]-12),t,10,{type:'sine',att:2,v:.07})}
  if(Math.random()<.3+MUS.inten*.3){const n=ch[b][0]+12+pick(PEN)+(Math.random()<.4?12:0);nt(mtof(n),t,2.6,{type:'sine',v:.05});nt(mtof(n)*2.005,t,1.4,{type:'sine',v:.012})}}},
